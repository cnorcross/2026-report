  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ng: 0 3rem; height: 52px;\n    background: oklch(98.5% 0.005 80 / 0.9);\n    backdrop-filter: blur(16px);\n    border-bottom: 1px solid transparent;\n    transition: border-color 0.3s;\n  }\n  nav.scrolled { border-bottom-color: var(--rule); }\n  .nav-wordmark {\n    font-family: 'DM Serif Display', serif;\n    font-size: 0.88rem;\n    color: var(--green);\n    text-decoration: none;\n    letter-spacing: -0.01em;\n  }\n  .nav-links { display: flex; gap: 0; list-style: none; }\n  .nav-links a {\n    font-size: 0.72rem;\n    font-weight: 500;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--ink-light);\n    text-decoration: none;\n    padding: 0.4rem 0.8rem;\n    border-radius: 4px;\n    transition: color 0.2s, background 0.2s;\n  }\n  .nav-links a:hover { color: var(--green); background: var(--green-light); }\n\n  /* ── HERO ── */\n  .hero {\n    min-height: 100vh;\n    display: grid;\n    grid-template-columns: 1fr 360px;\n    overflow: hidden;\n  }\n  .hero-left {\n    background: var(--bg);\n    padding: 10rem 3rem 5rem 5rem;\n    display: flex; flex-direction: column; justify-content: center;\n    position: relative;\n  }\n  .hero-left::after {\n    content: '';\n    position: absolute;\n    bottom: 0; left: 0; right: 0;\n    height: 1px;\n    background: var(--rule);\n  }\n  .hero-right {\n    background: var(--green);\n    display: flex; flex-direction: column; justify-content: flex-end;\n    padding: 3rem;\n    position: relative;\n    overflow: hidden;\n  }\n  .hero-right::before {\n    content: '';\n    position: absolute;\n    top: -80px; right: -80px;\n    width: 320px; height: 320px;\n    border-radius: 50%;\n    background: var(--lime);\n    opacity: 0.12;\n  }\n  .hero-right::after {\n    content: '';\n    position: absolute;\n    bottom: 60px; left: -60px;\n    width: 200px; height: 200px;\n    border-radius: 50%;\n    background: oklch(100% 0 0 / 0.04);\n  }\n  .hero-tag {\n    font-size: 0.68rem;\n    font-weight: 600;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: var(--green-mid);\n    margin-bottom: 1.5rem;\n    display: flex; align-items: center; gap: 0.6rem;\n  }\n  .hero-tag::before {\n    content: '';\n    display: block; width: 24px; height: 2px;\n    background: var(--lime);\n  }\n  h1 {\n    font-family: 'DM Serif Display', serif;\n    font-size: clamp(3rem, 6vw, 5.5rem);\n    font-weight: 400;\n    line-height: 1.0;\n    letter-spacing: -0.03em;\n    color: var(--green);\n    margin-bottom: 0.4rem;\n  }\n  h1 em {\n    font-style: italic;\n    color: var(--ink);\n    opacity: 0.5;\n  }\n  .hero-subtitle {\n    font-family: 'DM Serif Display', serif;\n    font-size: 1.1rem;\n    font-style: italic;\n    color: var(--ink-mid);\n    margin-bottom: 3rem;\n    font-weight: 400;\n  }\n  .hero-details {\n    display: flex; gap: 2.5rem; flex-wrap: wrap;\n  }\n  .hero-detail-item { }\n  .hero-detail-label {\n    font-size: 0.65rem;\n    font-weight: 600;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-light);\n    margin-bottom: 0.2rem;\n  }\n  .hero-detail-value {\n    font-size: 0.88rem;\n    font-weight: 400;\n    color: var(--ink);\n  }\n  .hero-stat-block {\n    position: relative; z-index: 1;\n  }\n  .hero-big-num {\n    font-family: 'DM Serif Display', serif;\n    font-size: 7rem;\n    font-weight: 400;\n    color: white;\n    line-height: 1;\n    margin-bottom: 0.2rem;\n  }\n  .hero-big-denom {\n    font-size: 2rem;\n    opacity: 0.4;\n  }\n  .hero-big-label {\n    font-size: 0.72rem;\n    font-weight: 500;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: oklch(100% 0 0 / 0.5);\n    margin-bottom: 3rem;\n  }\n  .hero-mini-stats {\n    display: flex; flex-direction: column; gap: 1rem;\n  }\n  .hero-mini-stat {\n    display: flex; align-items: baseline; gap: 0.75rem;\n    padding-top: 1rem;\n    border-top: 1px solid oklch(100% 0 0 / 0.12);\n  }\n  .hero-mini-stat-num {\n    font-family: 'DM Serif Display', serif;\n    font-size: 2rem;\n    color: var(--lime);\n    line-height: 1;\n  }\n  .hero-mini-stat-label {\n    font-size: 0.76rem;\n    font-weight: 400;\n    color: oklch(100% 0 0 / 0.5);\n    line-height: 1.4;\n  }\n\n  /* ── GENERIC SECTION ── */\n  section { padding: 6rem 2rem; }\n  .section-inner { max-width: var(--max); margin: 0 auto; }\n  .section-inner.wide { max-width: var(--max-wide); }\n\n  .section-num {\n    font-family: 'DM Serif Display', serif;\n    font-size: 5rem;\n    line-height: 1;\n    color: var(--rule);\n    font-weight: 400;\n    margin-bottom: -0.5rem;\n    display: block;\n    user-select: none;\n  }\n  .section-label {\n    font-size: 0.66rem;\n    font-weight: 600;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--green-mid);\n    margin-bottom: 0.6rem;\n    display: flex; align-items: center; gap: 0.5rem;\n  }\n  .section-label::before {\n    content: '';\n    display: block; width: 16px; height: 2px;\n    background: var(--lime);\n    flex-shrink: 0;\n  }\n  h2 {\n    font-family: 'DM Serif Display', serif;\n    font-size: clamp(1.8rem, 3.5vw, 2.6rem);\n    font-weight: 400;\n    letter-spacing: -0.025em;\n    line-height: 1.15;\n    color: var(--green);\n    margin-bottom: 1.8rem;\n  }\n  h3 {\n    font-family: 'DM Serif Display', serif;\n    font-size: 1.3rem;\n    font-weight: 400;\n    color: var(--ink);\n    margin-bottom: 0.7rem;\n    margin-top: 2.5rem;\n    letter-spacing: -0.01em;\n  }\n  h3:first-child { margin-top: 0; }\n  p {\n    font-size: 0.96rem;\n    font-weight: 300;\n    color: oklch(28% 0.012 155);\n    line-height: 1.85;\n    margin-bottom: 1.1rem;\n  }\n  p:last-child { margin-bottom: 0; }\n\n  /* ── PULL QUOTE ── */\n  .pull-quote {\n    border-left: 3px solid var(--lime);\n    margin: 2.5rem 0;\n    padding: 1rem 0 1rem 2rem;\n  }\n  .pull-quote p {\n    font-family: 'DM Serif Display', serif;\n    font-size: 1.4rem;\n    font-style: italic;\n    font-weight: 400;\n    color: var(--green);\n    line-height: 1.5;\n    margin: 0;\n  }\n\n  /* ── DIVIDER ── */\n  hr { border: none; border-top: 1px solid var(--rule); margin: 3.5rem 0; }\n\n  /* ── BG VARIANTS ── */\n  .bg-green { background: var(--green); }\n  .bg-green h2, .bg-green h3 { color: white; }\n  .bg-green p { color: oklch(78% 0.03 155); }\n  .bg-green .section-label { color: var(--lime); }\n  .bg-green .section-label::before { background: var(--lime); }\n  .bg-tint { background: var(--green-light); }\n\n  /* ── OVERVIEW STRIP ── */\n  .overview-strip {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    border: 1px solid var(--rule);\n    border-radius: 12px;\n    overflow: hidden;\n    margin-top: 3rem;\n  }\n  .overview-cell {\n    padding: 1.5rem;\n    border-right: 1px solid var(--rule);\n  }\n  .overview-cell:last-child { border-right: none; }\n  .oc-label {\n    font-size: 0.63rem;\n    font-weight: 600;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-light);\n    margin-bottom: 0.5rem;\n  }\n  .oc-value { font-size: 0.88rem; font-weight: 400; color: var(--ink); line-height: 1.5; }\n\n  /* ── FLOW ── */\n  .flow { margin-top: 2.5rem; }\n  .flow-step {\n    display: grid;\n    grid-template-columns: 56px 1fr;\n    gap: 0;\n    position: relative;\n  }\n  .flow-step + .flow-step { margin-top: 0; }\n  .flow-left {\n    display: flex; flex-direction: column; align-items: center;\n    padding-top: 2px;\n  }\n  .flow-dot {\n    width: 10px; height: 10px;\n    border-radius: 50%;\n    background: var(--lime);\n    border: 2px solid var(--bg);\n    outline: 1.5px solid var(--lime);\n    flex-shrink: 0;\n    margin-top: 6px;\n  }\n  .flow-line {\n    width: 1.5px;\n    background: var(--rule);\n    flex: 1;\n    min-height: 20px;\n  }\n  .flow-step:last-child .flow-line { display: none; }\n  .flow-right { padding: 0 0 2rem 0; }\n  .flow-right h4 {\n    font-size: 0.93rem;\n    font-weight: 600;\n    color: var(--ink);\n    margin-bottom: 0.3rem;\n    letter-spacing: -0.01em;\n  }\n  .flow-right p {\n    font-size: 0.84rem;\n    color: var(--ink-mid);\n    line-height: 1.6;\n    margin: 0;\n  }\n\n  /* ── CHALLENGE AREAS ── */\n  .challenge-list { margin-top: 2.5rem; }\n  .challenge-item {\n    display: grid;\n    grid-template-columns: 80px 1fr;\n    gap: 2rem;\n    padding: 2rem 0;\n    border-top: 1px solid var(--rule);\n    align-items: start;\n    transition: background 0.2s;\n  }\n  .challenge-item:last-child { border-bottom: 1px solid var(--rule); }\n  .challenge-n {\n    font-family: 'DM Serif Display', serif;\n    font-size: 3rem;\n    font-weight: 400;\n    color: var(--rule);\n    line-height: 1;\n    padding-top: 4px;\n  }\n  .challenge-content {}\n  .challenge-title {\n    font-family: 'DM Serif Display', serif;\n    font-size: 1.4rem;\n    font-weight: 400;\n    color: var(--green);\n    margin-bottom: 0.5rem;\n    letter-spacing: -0.01em;\n  }\n  .challenge-tag {\n    display: inline-block;\n    font-size: 0.62rem;\n    font-weight: 600;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    background: var(--lime);\n    color: var(--green);\n    padding: 0.2rem 0.6rem;\n    border-radius: 3px;\n    margin-bottom: 0.8rem;\n  }\n  .challenge-desc { font-size: 0.88rem; color: var(--ink-mid); line-height: 1.7; margin: 0; font-weight: 300; }\n\n  /* ── TABS ── */\n  .tabs { margin-top: 2.5rem; }\n  .tab-buttons {\n    display: flex; gap: 0;\n    border-bottom: 1.5px solid var(--rule);\n    margin-bottom: 2.5rem;\n  }\n  .tab-btn {\n    font-family: 'Outfit', sans-serif;\n    font-size: 0.8rem;\n    font-weight: 500;\n    letter-spacing: 0.04em;\n    color: var(--ink-light);\n    background: none; border: none;\n    border-bottom: 2px solid transparent;\n    margin-bottom: -1.5px;\n    padding: 0.7rem 1.4rem;\n    cursor: pointer;\n    transition: color 0.2s, border-color 0.2s;\n  }\n  .tab-btn:hover { color: var(--green); }\n  .tab-btn.active { color: var(--green); border-bottom-color: var(--lime); font-weight: 600; }\n  .tab-panel { display: none; }\n  .tab-panel.active { display: block; }\n\n  /* ── LIST ── */\n  ul.report-list {\n    list-style: none;\n    margin: 1.2rem 0;\n    display: flex; flex-direction: column; gap: 0.65rem;\n  }\n  ul.report-list li {\n    font-size: 0.9rem;\n    font-weight: 300;\n    color: oklch(28% 0.012 155);\n    padding-left: 1.4rem;\n    position: relative;\n    line-height: 1.7;\n  }\n  ul.report-list li::before {\n    content: '';\n    position: absolute; left: 0; top: 0.6em;\n    width: 8px; height: 1.5px;\n    background: var(--lime);\n  }\n\n  /* ── SURVEY ── */\n  .survey-block {\n    display: grid;\n    grid-template-columns: 280px 1fr;\n    gap: 0;\n    border: 1.5px solid var(--rule);\n    border-radius: 14px;\n    overflow: hidden;\n    margin-bottom: 2.5rem;\n  }\n  .survey-left {\n    background: var(--green);\n    padding: 3rem;\n    display: flex; flex-direction: column; justify-content: center;\n  }\n  .survey-big {\n    font-family: 'DM Serif Display', serif;\n    font-size: 6rem;\n    font-weight: 400;\n    color: white;\n    line-height: 1;\n    margin-bottom: 0.2rem;\n  }\n  .survey-denom { font-size: 2rem; opacity: 0.4; }\n  .survey-label {\n    font-size: 0.68rem;\n    font-weight: 600;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--lime);\n  }\n  .survey-right { padding: 2.5rem 2.5rem; }\n  .survey-right h3 { margin-top: 0; font-size: 1.1rem; }\n  .feedback-cols {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 2rem;\n    margin-top: 1.5rem;\n  }\n  .feedback-col h4 {\n    font-size: 0.68rem;\n    font-weight: 600;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--green-mid);\n    margin-bottom: 1rem;\n    display: flex; align-items: center; gap: 0.5rem;\n  }\n  .feedback-col h4::before { content:''; display:block; width:12px; height:2px; background:var(--lime); }\n\n  /* ── RECS ── */\n  .recs-list { margin-top: 2rem; }\n  .rec-item {\n    padding: 2rem 0;\n    border-top: 1px solid var(--rule);\n    display: grid;\n    grid-template-columns: 200px 1fr;\n    gap: 3rem;\n    align-items: start;\n  }\n  .rec-item:last-child { border-bottom: 1px solid var(--rule); }\n  .rec-area {\n    font-family: 'DM Serif Display', serif;\n    font-size: 1.1rem;\n    font-weight: 400;\n    color: var(--green);\n    line-height: 1.3;\n    padding-top: 2px;\n  }\n\n  /* ── FUTURE ── */\n  .future-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 1px;\n    background: var(--rule);\n    border: 1px solid var(--rule);\n    border-radius: 12px;\n    overflow: hidden;\n    margin-top: 2.5rem;\n  }\n  .future-item {\n    background: var(--bg);\n    padding: 1.8rem 2rem;\n  }\n  .future-item h4 {\n    font-size: 0.78rem;\n    font-weight: 600;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--green-mid);\n    margin-bottom: 0.6rem;\n  }\n  .future-item p { font-size: 0.87rem; margin: 0; color: var(--ink-mid); font-weight: 300; line-height: 1.65; }\n\n  /* ── CLOSING ── */\n  .closing-inner {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 6rem;\n    align-items: center;\n  }\n  .closing-text h2 { font-size: clamp(2rem, 4vw, 3.2rem); }\n  .closing-stat {\n    text-align: center;\n    padding: 4rem 2rem;\n    border: 1.5px solid oklch(100% 0 0 / 0.1);\n    border-radius: 16px;\n  }\n  .closing-stat-num {\n    font-family: 'DM Serif Display', serif;\n    font-size: 8rem;\n    font-weight: 400;\n    color: var(--lime);\n    line-height: 1;\n    margin-bottom: 0.5rem;\n  }\n  .closing-stat-label {\n    font-size: 0.75rem;\n    font-weight: 500;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: oklch(68% 0.04 155);\n  }\n\n  footer {\n    background: oklch(12% 0.02 155);\n    color: oklch(40% 0.01 155);\n    text-align: center;\n    padding: 2rem;\n    font-size: 0.74rem;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n  }\n\n  /* ── FADE IN ── */\n  .fi { opacity: 0; transform: translateY(18px); transition: opacity 0.65s ease, transform 0.65s ease; }\n  .fi.vis { opacity: 1; transform: none; }\n  .fi.d1 { transition-delay: 0.08s; }\n  .fi.d2 { transition-delay: 0.16s; }\n  .fi.d3 { transition-delay: 0.24s; }\n\n  @media (max-width: 768px) {\n    .hero { grid-template-columns: 1fr; }\n    .hero-right { padding: 3rem 2rem; min-height: 280px; }\n    .hero-left { padding: 7rem 2rem 3rem; }\n    nav { padding: 0 1.5rem; }\n    .nav-links { display: none; }\n    .survey-block { grid-template-columns: 1fr; }\n    .closing-inner { grid-template-columns: 1fr; gap: 2rem; }\n    .rec-item { grid-template-columns: 1fr; gap: 0.5rem; }\n    .overview-strip { grid-template-columns: 1fr 1fr; }\n    .overview-cell { border-right: none; border-bottom: 1px solid var(--rule); }\n    .feedback-cols { grid-template-columns: 1fr; }\n    .future-grid { grid-template-columns: 1fr; }\n    h1 { font-size: 3rem; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<nav id=\"nav\">\n  <a href=\"#top\" class=\"nav-wordmark\">One College Many Stories<\u002Fa>\n  <ul class=\"nav-links\">\n    <li><a href=\"#overview\">Overview<\u002Fa><\u002Fli>\n    <li><a href=\"#morning\">Morning<\u002Fa><\u002Fli>\n    <li><a href=\"#patterns\">Patterns<\u002Fa><\u002Fli>\n    <li><a href=\"#afternoon\">Afternoon<\u002Fa><\u002Fli>\n    <li><a href=\"#results\">Results<\u002Fa><\u002Fli>\n    <li><a href=\"#future\">Future<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<!-- HERO -->\n<div class=\"hero\" id=\"top\">\n  <div class=\"hero-left\">\n    <div class=\"hero-tag\">Palomar College · EEDCC · 2026 Event Report<\u002Fdiv>\n    <h1>One College<br><em>Many<\u002Fem><br>Stories<\u002Fh1>\n    <div class=\"hero-subtitle\">Creating a Culturally Responsive Community for Learning<\u002Fdiv>\n    <div class=\"hero-details\">\n      <div class=\"hero-detail-item\">\n        <div class=\"hero-detail-label\">Date<\u002Fdiv>\n        <div class=\"hero-detail-value\">Friday, January 23, 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hero-detail-item\">\n        <div class=\"hero-detail-label\">Time<\u002Fdiv>\n        <div class=\"hero-detail-value\">10:00 AM – 3:00 PM<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hero-detail-item\">\n        <div class=\"hero-detail-label\">Location<\u002Fdiv>\n        <div class=\"hero-detail-value\">LRC-438 &amp; Campus<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-right\">\n    <div class=\"hero-stat-block\">\n      <div class=\"hero-big-num\">9.44<span class=\"hero-big-denom\">/10<\u002Fspan><\u002Fdiv>\n      <div class=\"hero-big-label\">Average participant value rating<\u002Fdiv>\n      <div class=\"hero-mini-stats\">\n        <div class=\"hero-mini-stat\">\n          <div class=\"hero-mini-stat-num\">5<\u002Fdiv>\n          <div class=\"hero-mini-stat-label\">Challenge areas<br>identified<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hero-mini-stat\">\n          <div class=\"hero-mini-stat-num\">3<\u002Fdiv>\n          <div class=\"hero-mini-stat-label\">Core themes<br>explored in depth<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"hero-mini-stat\">\n          <div class=\"hero-mini-stat-num\">7<\u002Fdiv>\n          <div class=\"hero-mini-stat-label\">Structured activity<br>phases<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- OVERVIEW -->\n<section id=\"overview\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">01<\u002Fspan>\n    <div class=\"section-label fi\">Event Overview<\u002Fdiv>\n    <h2 class=\"fi\">A day centered<br>on student voices<\u002Fh2>\n    <p class=\"fi\">One College Many Stories, held on Friday, January 23, 2026, was designed to center student voices and foster meaningful dialogue across the Palomar College community. The morning began with a grounding session featuring Umoja students, followed by attendees dividing into mixed constituent groups to participate in Story Circles where student experiences served as the foundation for discussion.<\u002Fp>\n    <p class=\"fi\">Participants then moved into Pattern Harvesting, collaboratively identifying themes emerging from the stories they heard. Over lunch, table facilitators condensed the themes into a Living Pattern Wall. The afternoon sessions invited participants to examine how those patterns show up in their own work. The day closed with reflection on what stayed with participants, what felt unresolved, and what they planned to change.<\u002Fp>\n\n    <div class=\"overview-strip fi\">\n      <div class=\"overview-cell\">\n        <div class=\"oc-label\">Organizer<\u002Fdiv>\n        <div class=\"oc-value\">EEDCC — Equity, Engagement &amp; Dialogue Coordinating Committee<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"overview-cell\">\n        <div class=\"oc-label\">Anchor Community<\u002Fdiv>\n        <div class=\"oc-value\">Umoja Students — led opening &amp; morning session<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"overview-cell\">\n        <div class=\"oc-label\">Format<\u002Fdiv>\n        <div class=\"oc-value\">Story Circles, Pattern Harvesting, Living Pattern Wall, Afternoon Sessions<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"overview-cell\">\n        <div class=\"oc-label\">Participants<\u002Fdiv>\n        <div class=\"oc-value\">Faculty, Staff, Students &amp; Administrators in mixed groups<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- STRUCTURE -->\n<section class=\"bg-tint\" id=\"structure\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">02<\u002Fspan>\n    <div class=\"section-label fi\">Event Design<\u002Fdiv>\n    <h2 class=\"fi\">How we built<br>the structure<\u002Fh2>\n    <p class=\"fi\">The structure was developed through a deliberate progression — from problem definition to model selection to event design. The Human Library model became especially influential because it operationalizes storytelling as data, allowing lived experiences to function as both evidence and entry point for dialogue. <em>\"Many Stories\"<\u002Fem> signals that student narratives are not supplementary but foundational; <em>\"One College\"<\u002Fem> establishes the institutional responsibility to collectively act on them.<\u002Fp>\n\n    <div class=\"flow fi\">\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Introduction<\u002Fh4><p>Shared framing and context-setting for all participants<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Story Circles — Student Reality<\u002Fh4><p>Tables of 10, including a facilitator and at least one student storyteller. Focus on listening, follow-up questions, and clarifications.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Pattern Harvesting<\u002Fh4><p>A series of conversations in varying talk structures to identify what patterns or topics emerge from the student stories.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Living Pattern Wall <span style=\"font-weight:300;opacity:0.6;\">(During Lunch)<\u002Fspan><\u002Fh4><p>Table facilitators created pattern clusters sharing the same or related themes. Participants selected a cluster to focus on in the afternoon.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Analysis<\u002Fh4><p>Tables organized by pattern cluster. Mixed constituent groups define the concern in actionable language and imagine solutions.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Synthesis<\u002Fh4><p>Participants re-grouped by constituency and shared how they could address changes in their daily work and as change agents at the college level.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-step\">\n        <div class=\"flow-left\"><div class=\"flow-dot\"><\u002Fdiv><div class=\"flow-line\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-right\"><h4>Closing Reflection<\u002Fh4><p>Attendees shared what stayed with them, what felt unresolved, and what they planned to change.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- MORNING -->\n<section id=\"morning\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">03<\u002Fspan>\n    <div class=\"section-label fi\">Morning Session<\u002Fdiv>\n    <h2 class=\"fi\">Umoja-led opening &amp; Story Circles<\u002Fh2>\n    <p class=\"fi\">The opening and morning session were Umoja student-led. Umoja students guided participants through their community agreements and practices. After a personal reflection activity, students joined small groups with faculty and shared their experiences as students at Palomar College.<\u002Fp>\n    <p class=\"fi\">Committee members facilitated small groups, but student voices were centered throughout. This prompted important conversations about building connections and rapport with students, and what support services have helped Umoja students. These conversations led to establishing patterns and topics for the afternoon session.<\u002Fp>\n\n    <div class=\"pull-quote fi\">\n      <p>\"Students shared very positive feedback — highlighting an engaging atmosphere, meaningful discussions, and a renewed sense of community.\"<\u002Fp>\n    <\u002Fdiv>\n\n    <p class=\"fi\">Other attendees reported feeling inspired and motivated after the event, citing practical takeaways and opportunities to connect with peers and presenters. Students expressed interest in attending similar programs in the future — and overall responses indicate that the event was impactful, enjoyable, and successful in meeting its intended goals.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PATTERNS -->\n<section class=\"bg-tint\" id=\"patterns\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">04<\u002Fspan>\n    <div class=\"section-label fi\">Pattern Harvesting<\u002Fdiv>\n    <h2 class=\"fi\">5 challenge areas<br>that emerged<\u002Fh2>\n    <p class=\"fi\">Through the personal reflection activity and the sharing of student experiences, participants identified patterns which helped produce a list of 5 challenge areas. These were later condensed into 3 core themes: Community, Resources &amp; Access, and Mentoring.<\u002Fp>\n\n    <div class=\"challenge-list fi\">\n      <div class=\"challenge-item\">\n        <div class=\"challenge-n\">01<\u002Fdiv>\n        <div class=\"challenge-content\">\n          <div class=\"challenge-tag\">Condensed → Resources &amp; Access<\u002Fdiv>\n          <div class=\"challenge-title\">Accessibility<\u002Fdiv>\n          <div class=\"challenge-desc\">Student reflections on affordability, resources, mindfulness of student workload, and opportunities for success where faculty and staff support students.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"challenge-item\">\n        <div class=\"challenge-n\">02<\u002Fdiv>\n        <div class=\"challenge-content\">\n          <div class=\"challenge-tag\">Condensed → Mentoring<\u002Fdiv>\n          <div class=\"challenge-title\">Mentoring<\u002Fdiv>\n          <div class=\"challenge-desc\">The value of all experiences, spreading the importance of community, student mentors, and the boiling pot analogy of horizontal leadership.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"challenge-item\">\n        <div class=\"challenge-n\">03<\u002Fdiv>\n        <div class=\"challenge-content\">\n          <div class=\"challenge-tag\">Condensed → Community<\u002Fdiv>\n          <div class=\"challenge-title\">Power in Community<\u002Fdiv>\n          <div class=\"challenge-desc\">Sharing student group contacts, finding your \"village,\" the importance of belonging, fears of the loneliness epidemic, and breaking stereotypes.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"challenge-item\">\n        <div class=\"challenge-n\">04<\u002Fdiv>\n        <div class=\"challenge-content\">\n          <div class=\"challenge-tag\">Condensed → Community<\u002Fdiv>\n          <div class=\"challenge-title\">Uncertainty<\u002Fdiv>\n          <div class=\"challenge-desc\">Self-doubt and cultivating confidence, self-imposed limitations as barriers to success, and systemic gaps in higher education.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"challenge-item\">\n        <div class=\"challenge-n\">05<\u002Fdiv>\n        <div class=\"challenge-content\">\n          <div class=\"challenge-tag\">Condensed → Community<\u002Fdiv>\n          <div class=\"challenge-title\">Perceptions of Community College<\u002Fdiv>\n          <div class=\"challenge-desc\">Student expressions of the stigma of attending a community college, and efforts to rebrand those perceptions through lived success stories.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- AFTERNOON -->\n<section id=\"afternoon\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">05<\u002Fspan>\n    <div class=\"section-label fi\">Afternoon Sessions<\u002Fdiv>\n    <h2 class=\"fi\">Deep dives into<br>three core themes<\u002Fh2>\n    <p class=\"fi\">The afternoon organized participants into tables by pattern cluster topic, drawing from all constituent groups to follow a facilitated process of defining concerns and imagining actionable solutions.<\u002Fp>\n\n    <div class=\"tabs fi\">\n      <div class=\"tab-buttons\">\n        <button class=\"tab-btn active\" onclick=\"showTab('community', this)\">Community<\u002Fbutton>\n        <button class=\"tab-btn\" onclick=\"showTab('resources', this)\">Resources &amp; Access<\u002Fbutton>\n        <button class=\"tab-btn\" onclick=\"showTab('mentoring', this)\">Mentoring<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"tab-panel active\" id=\"tab-community\">\n        <p>Students described how they felt isolated, lonely, overwhelmed, and lost — often considering dropping out until they discovered a community that created a sense of belonging. Even then, as they established a connection to that specific group (e.g. Umoja), they often did not feel a connection to the college as a whole. Students who do not come from a family culture of higher education often feel like outsiders.<\u002Fp>\n        <h3>Suggestions<\u002Fh3>\n        <ul class=\"report-list\">\n          <li>An authentic, in-person orientation for new students with human contact with peers and college employees<\u002Fli>\n          <li>Robust peer mentorship program<\u002Fli>\n          <li>Simplified enrollment process<\u002Fli>\n          <li>Expand and support affinity groups and student interest groups<\u002Fli>\n          <li>Public cultural art on campus that welcomes the diverse elements of our community<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"tab-panel\" id=\"tab-resources\">\n        <p>Our group consisted of faculty and students. We found that most of the resources students expressed a need for are already offered by Palomar, but access to them is limited. We explored the need for improved website navigation, consistency of information, and academic counselling.<\u002Fp>\n        <p>Students also mentioned an interest in having resources communicated in different forms such as physical handouts, online, etc. Ways to make resources more obvious and approachable included providing access via Canvas and inviting resource speakers into class.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tab-panel\" id=\"tab-mentoring\">\n        <p>Both faculty and students emphasized that mentorship is a key mechanism for building trust, engagement, and a sense of belonging. Students shared practical suggestions for how faculty can establish rapport, highlighting the importance of approachability and consistent communication.<\u002Fp>\n        <p>A recurring theme was the need for faculty to remain accessible by <em>\"keeping the door open\"<\u002Fem> — both literally and figuratively. One faculty member characterized mentorship as a \"one-way street\" from mentor to mentee: the value lies in supporting student growth, not in reciprocal returns. Participants suggested structured training to help faculty develop effective mentoring strategies.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SURVEY RESULTS -->\n<section id=\"results\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">06<\u002Fspan>\n    <div class=\"section-label fi\">Feedback Survey<\u002Fdiv>\n    <h2 class=\"fi\">Participants rated<br>the event highly<\u002Fh2>\n\n    <div class=\"survey-block fi\">\n      <div class=\"survey-left\">\n        <div class=\"survey-big\">9.44<span class=\"survey-denom\">/10<\u002Fspan><\u002Fdiv>\n        <div class=\"survey-label\">Average value rating<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"survey-right\">\n        <h3>Key Takeaways<\u002Fh3>\n        <p style=\"font-size:0.88rem;\">The event was highly successful, with participants finding significant value in the student-led stories and organized format.<\u002Fp>\n        <div class=\"feedback-cols\">\n          <div class=\"feedback-col\">\n            <h4>What participants liked<\u002Fh4>\n            <ul class=\"report-list\">\n              <li><strong>Student stories<\u002Fstrong> — unique perspectives were the highlight<\u002Fli>\n              <li><strong>Format<\u002Fstrong> — \"nicely organized\" stations and \"dynamic\" discussions<\u002Fli>\n              <li><strong>Community<\u002Fstrong> — connecting with passionate colleagues and students<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"feedback-col\">\n            <h4>Suggested improvements<\u002Fh4>\n            <ul class=\"report-list\">\n              <li>Invite even more students to participate<\u002Fli>\n              <li>More institutional support for such initiatives<\u002Fli>\n              <li>More time to attend both sessions<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- RECOMMENDATIONS -->\n<section class=\"bg-tint\" id=\"recommendations\">\n  <div class=\"section-inner\">\n    <span class=\"section-num fi\">07<\u002Fspan>\n    <div class=\"section-label fi\">Recommendations &amp; Conclusions<\u002Fdiv>\n    <h2 class=\"fi\">A model worth<br>developing<\u002Fh2>\n    <p class=\"fi\">While attendance was less than capacity, feedback confirmed that the event was nevertheless successful in creating meaningful connections for students, staff, faculty, and administrators. EEDCC concluded that this format is one to keep and develop. Recommendations for next year focus on better promotion, higher student recruitment, and earlier preparation.<\u002Fp>\n\n    <div class=\"pull-quote fi\">\n      <p>\"We believe this is a unique and innovative model for doing authentic, student-centered equity work at Community Colleges — with the potential to inspire institutions across California and beyond.\"<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"recs-list fi\">\n      <div class=\"rec-item\">\n        <div class=\"rec-area\">Resources &amp; Access<\u002Fdiv>\n        <ul class=\"report-list\">\n          <li>Invite resource representatives to talk in class rather than expecting students to attend resource fairs during welcome week<\u002Fli>\n          <li>Prerecorded info guides integrated into Canvas shells<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"rec-item\">\n        <div class=\"rec-area\">Community &amp; Belonging<\u002Fdiv>\n        <ul class=\"report-list\">\n          <li>Authentic, in-person orientation for new students<\u002Fli>\n          <li>Robust peer mentorship program<\u002Fli>\n          <li>Simplified enrollment process<\u002Fli>\n          <li>Expand and support affinity groups and student interest groups<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"rec-item\">\n        <div class=\"rec-area\">Campus Culture<\u002Fdiv>\n        <ul class=\"report-list\">\n          <li>Public cultural art on campus welcoming the diverse elements of our community<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FUTURE STEPS -->\n<section class=\"bg-green\" id=\"future\">\n  <div class=\"section-inner wide\">\n    <span class=\"section-num fi\" style=\"color:oklch(100% 0 0 / 0.08);\">08<\u002Fspan>\n    <div class=\"section-label fi\">Future Steps<\u002Fdiv>\n    <h2 class=\"fi\">Planning for<br>a stronger 2027<\u002Fh2>\n    <p class=\"fi\" style=\"max-width:580px;\">In Fall 2026, EEDCC will improve event promotion with specific dates for student involvement and focus on creating a welcoming, safe space with consistent communication for students to share their stories.<\u002Fp>\n\n    <div class=\"future-grid fi\">\n      <div class=\"future-item\">\n        <h4>Student Storytellers<\u002Fh4>\n        <p>More deliberate preparation, with incentives to participate. Pair new students with participants from last year's event for a mentor matchup.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"future-item\">\n        <h4>Umoja Collaboration<\u002Fh4>\n        <p>Continued and deepened collaboration with the Umoja community as a founding anchor for the event.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"future-item\">\n        <h4>Meaningful Compensation<\u002Fh4>\n        <p>Find meaningful compensation for participating students, including swag like shirts for students to wear during the event.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"future-item\">\n        <h4>Event Timing<\u002Fh4>\n        <p>Shift the date to an earlier day during FLEX week to encourage higher participation across all constituent groups.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"future-item\">\n        <h4>Expanded Student Panels<\u002Fh4>\n        <p>Add different student panels addressing different topics: registration process, support groups, college services, classes, and instruction methods.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"future-item\">\n        <h4>Anonymous Participation<\u002Fh4>\n        <p>Add a system for students who want to remain anonymous. Improve strategies to encourage administrator participation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CLOSING -->\n<section class=\"bg-green\">\n  <div class=\"section-inner wide\">\n    <div class=\"closing-inner\">\n      <div class=\"closing-text\">\n        <div class=\"section-label fi\">Thank You<\u002Fdiv>\n        <h2 class=\"fi\">Stories<br><em>drive change.<\u002Fem><\u002Fh2>\n        <p class=\"fi\">One College Many Stories is a unique and innovative model for doing authentic, student-centered equity work at Community Colleges — designed to be adapted and adopted by institutions across the state.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"closing-stat fi\">\n        <div class=\"closing-stat-num\">9.44<\u002Fdiv>\n        <div class=\"closing-stat-label\">Out of 10 · Average Participant Value Rating<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  One College Many Stories 2026 · Palomar College · EEDCC · Report compiled April 2026\n<\u002Ffooter>\n\n<script>\n  const nav = document.getElementById('nav');\n  window.addEventListener('scroll', () => { nav.classList.toggle('scrolled', window.scrollY > 40); });\n\n  const obs = new IntersectionObserver((entries) => {\n    entries.forEach((entry, i) => {\n      if (entry.isIntersecting) {\n        setTimeout(() => entry.target.classList.add('vis'), 50 * i);\n        obs.unobserve(entry.target);\n      }\n    });\n  }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });\n  document.querySelectorAll('.fi').forEach(el => obs.observe(el));\n\n  function showTab(id, btn) {\n    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));\n    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));\n    document.getElementById('tab-' + id).classList.add('active');\n    btn.classList.add('active');\n  }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
